 <!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Learn cybersecurity with Secora."
  >

  <title>Course — Secora</title>


  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- Course CSS -->

  <link
    rel="stylesheet"
    href="course.css"
  >

</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="course-header">

    <div class="header-inner">

      <a
        href="home.html"
        class="brand"
      >
        SECORA
      </a>


      <a
        href="home.html"
        class="back-dashboard"
      >
        ← Dashboard
      </a>

    </div>

  </header>



  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="course-page">


    <!-- ===================================================
         HERO
         =================================================== -->

    <section class="course-hero">


      <div class="course-hero-content">

        <div class="course-eyebrow">
          COURSE
        </div>


        <h1 id="courseTitle">
          Loading course...
        </h1>


        <p
          id="courseDescription"
          class="course-description"
        >
          Loading course description...
        </p>


        <div class="course-meta">

          <span id="courseLevel">
            BEGINNER
          </span>


          <span class="meta-divider">
            •
          </span>


          <span id="moduleCount">
            0 MODULES
          </span>


          <span class="meta-divider">
            •
          </span>


          <span id="lessonCount">
            0 LESSONS
          </span>

        </div>

      </div>



      <!-- =================================================
           PROGRESS
           ================================================= -->

      <aside class="course-progress-card">


        <div
          class="progress-ring"
          id="progressRing"
        >

          <span id="progressPercent">
            0%
          </span>

        </div>


        <div class="progress-details">

          <span id="progressLessons">
            0 / 0 lessons
          </span>

        </div>


        <span class="progress-label">
          COURSE PROGRESS
        </span>


      </aside>


    </section>



    <!-- ===================================================
         CURRICULUM
         =================================================== -->

    <section class="curriculum-section">


      <div class="section-heading">


        <div>

          <span class="section-eyebrow">
            CURRICULUM
          </span>


          <h2>
            Course structure
          </h2>

        </div>


        <p>
          Work through each module
          and complete the lessons at your pace.
        </p>


      </div>



      <!-- MODULES -->

      <div
        id="modulesContainer"
        class="modules-container"
      >

        <div class="course-loading">
          Loading curriculum...
        </div>

      </div>


    </section>


  </main>



  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="supabase.js"></script>


  <!-- =====================================================
       COURSE SCRIPT
       ===================================================== -->

  <script>

    // Wait until Supabase has been initialized
    // before loading course.js.

    function loadCourseScript() {

      if (
        typeof window.secoraSupabase !== "undefined"
      ) {

        const script =
          document.createElement("script");

        script.src =
          "course.js";

        document.body.appendChild(
          script
        );

        return;

      }


      setTimeout(
        loadCourseScript,
        50
      );

    }


    loadCourseScript();

  </script>


</body>

</html>
