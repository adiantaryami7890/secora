<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secora — Create account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth-pages.css"></head><body class="auth-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SECORA</span></a></header><main class="auth-card-wrap"><section class="auth-card"><p class="kicker">START LEARNING</p><h1>Create your account</h1><p class="sub">Create your Secora learning space and begin with the fundamentals.</p><form id="form"><label>Full name</label><input id="name" autocomplete="name" required placeholder="Your name"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="new-password" required placeholder="At least 6 characters"><label>Confirm password</label><input id="confirm" type="password" autocomplete="new-password" required placeholder="Repeat your password"><button class="primary-btn auth-submit" id="submit" type="submit"><span>Create account</span><span>→</span></button><p class="form-status" id="status"></p></form><div class="divider"><span>OR</span></div><button class="google-btn" id="google" type="button"><span class="google-icon">G</span> Continue with Google</button><p class="signup auth-switch">Already have an account? <a href="index.html">Sign in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script><script src="signup.js"></script></body></ht
